services:
  - type: web
    name: daily-martian
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
